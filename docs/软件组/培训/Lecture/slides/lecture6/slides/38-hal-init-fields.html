<section><div class="slide-head"><h2 class="slide-title">GPIO_InitTypeDef 字段</h2><p class="lead">一个结构体描述一组配置相同的引脚。</p></div><div class="why-line"><b>Pin</b><span>位掩码，可用 <span class="mono">GPIO_PIN_0 | GPIO_PIN_1</span> 一次配置多个脚。</span></div><div class="why-line"><b>Mode</b><span>输入、输出、模拟、复用或 EXTI 边沿。</span></div><div class="why-line"><b>Pull</b><span>无拉、上拉或下拉；F1 HAL 会处理 ODR 细节。</span></div><div class="why-line"><b>Speed</b><span>仅对输出和复用输出有意义。</span></div><div class="callout">每次重新使用结构体时都给相关字段赋值，避免沿用上一次配置。</div></section>
