<section><div class="slide-head"><h2 class="slide-title">按键输入的两种可靠接法</h2><p class="lead">按键松开时也必须有确定电平，否则引脚会被噪声随机影响。</p></div><div class="explain-grid"><div class="explain"><h3>上拉输入，按下接地</h3><p>松开为 1，按下为 0。常用于低电平有效按键。</p><div class="terminal">3.3V ─ Rpullup ─ GPIO ─ button ─ GND</div></div><div class="explain"><h3>下拉输入，按下接 3.3 V</h3><p>松开为 0，按下为 1。适合高电平有效输入。</p><div class="terminal">3.3V ─ button ─ GPIO ─ Rpulldown ─ GND</div></div></div><div class="circuit-note">内部上下拉适合短线、低速按键。长线或强干扰环境常使用外部电阻，并增加 RC 滤波与保护。</div></section>
