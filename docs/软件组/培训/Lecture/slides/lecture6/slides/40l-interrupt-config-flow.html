<section><div class="slide-head"><h2 class="slide-title">GPIO 外部中断配置流程</h2><p class="lead">配置同时跨越 GPIO、AFIO、EXTI 和 NVIC，漏掉任何一层都不会形成完整链路。</p></div><img class="schematic tall" src="img/interrupt-config-flow.png" alt="GPIO 外部中断配置流程"><div class="photo-caption">从 GPIO 时钟和输入模式到 NVIC 与中断服务函数</div><div class="why-line"><b>GPIO 与 AFIO</b><span>使能时钟，配置输入、上下拉和端口到 EXTI 的映射。</span></div><div class="why-line"><b>EXTI 与 NVIC</b><span>选择边沿并解除屏蔽，再设置 IRQ 优先级和使能状态。</span></div><div class="why-line"><b>软件入口</b><span>IRQHandler 调用 HAL 通用处理函数，HAL 清标志后进入用户回调。</span></div></section>
