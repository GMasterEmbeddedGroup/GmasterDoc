<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单页预览：Lecture 4</title>
<link rel="stylesheet" href="../lecture3/vendor/reveal.js/reveal.css"><link rel="stylesheet" href="../lecture3/theme.css"><link rel="stylesheet" href="../lecture3/deck.css"><link rel="stylesheet" href="lecture4.css">
<style>.onebar{position:fixed;z-index:99;left:0;right:0;top:0;height:42px;display:flex;gap:12px;align-items:center;padding:0 16px;background:#14161a;color:#fff;font:14px sans-serif}.onebar .brand{color:#ff4a53;font-weight:700}.onebar button,.onebar select{font:inherit}.onebar .file{margin-left:auto;color:#b9c0c9}.reveal{top:42px;height:calc(100% - 42px)}</style></head>
<body><div class="onebar"><span class="brand">GMaster</span><span>Lecture 4 单页预览</span><button id="prev">← 上一页</button><button id="next">下一页 →</button><select id="jump"></select><span class="file" id="file"></span><span id="pos"></span></div><div class="reveal"><div class="slides"><section><h2>正在载入…</h2></section></div></div>
<script src="../lecture3/vendor/reveal.js/reveal.js"></script><script src="../lecture3/vendor/reveal.js/plugin/highlight/highlight.js"></script><script src="../lecture3/deck.js"></script><script src="slides/manifest.js"></script><script>
(function(){var list=window.DECK_SLIDES,slidesEl=document.querySelector('.reveal .slides'),jump=document.getElementById('jump');list.forEach(function(s,i){var o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+' '+s.title;jump.appendChild(o)});function idx(){var p=parseInt(new URLSearchParams(location.search).get('p'),10);return isNaN(p)||p<1||p>list.length?0:p-1}function render(i){var item=list[i];document.getElementById('file').textContent='slides/'+item.file;document.getElementById('pos').textContent=String(i+1).padStart(2,'0')+' / '+list.length;jump.value=i;DeckKit.loadFragments([item.file],slidesEl).then(function(){DeckKit.initAll(document);if(!window.__ready){window.__ready=true;DeckKit.initReveal({hash:false,controls:false,progress:false,slideNumber:false,overview:false,keyboard:false,touch:false,plugins:[window.RevealHighlight].filter(Boolean)})}else{Reveal.sync();Reveal.slide(0);Reveal.layout()}})}function go(i){i=(i+list.length)%list.length;history.replaceState(null,'','?p='+(i+1));render(i)}document.getElementById('prev').onclick=function(){go(idx()-1)};document.getElementById('next').onclick=function(){go(idx()+1)};jump.onchange=function(){go(Number(jump.value))};document.onkeydown=function(e){if(e.key==='ArrowLeft'||e.key==='PageUp')go(idx()-1);if(e.key==='ArrowRight'||e.key==='PageDown')go(idx()+1)};render(idx())})();
</script></body></html>
