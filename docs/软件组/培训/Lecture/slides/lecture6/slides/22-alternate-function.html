<section><div class="slide-head"><h2 class="slide-title">复用功能输出</h2><p class="lead">GPIO 仍配置电气类型，但电平控制权交给 USART、SPI 或定时器等外设。</p></div><div class="pipeline"><div class="node">TIM2 比较器</div><div class="arrow">→</div><div class="node hot">PA0 复用推挽</div><div class="arrow">→</div><div class="node">PWM 波形</div></div><div class="explain"><p>USART_TX、SPI_SCK、PWM 常用复用推挽；I²C 使用复用开漏。F1 的部分功能需要 AFIO 重映射。</p><p>只初始化外设而未正确配置引脚，外设寄存器可能正常运行，但焊盘没有预期波形。</p></div></section>
