<section><div class="slide-head"><h2 class="slide-title">NVIC 管理中断请求</h2><p class="lead">NVIC 是 Nested Vectored Interrupt Controller，负责使能、挂起、优先级和嵌套。</p></div><img class="schematic" src="img/nvic-structure.png" alt="NVIC 结构"><div class="photo-caption">外部 IRQ 经过使能与优先级判断后送入 Cortex-M3 CPU</div><div class="why-line"><b>使能 Enabled</b><span>允许 NVIC 响应某个 IRQ。没有使能时，外设标志可以置位，但 CPU 不进入 ISR。</span></div><div class="why-line"><b>挂起 Pending</b><span>请求已经出现但尚未处理，可能正在等待更高优先级中断结束。</span></div><div class="why-line"><b>活动 Active</b><span>CPU 正在执行该中断的 ISR。</span></div></section>
