<section><div class="slide-head"><h2 class="slide-title">寄存器是什么</h2><p class="lead">寄存器是外设内部可由 CPU 读写的一组控制位和状态位。写入不同位组合会改变硬件连接。</p></div><div class="explain"><p>GPIOC 是一块硬件外设。它在内存地址空间中拥有 CRL、CRH、IDR、ODR、BSRR 等寄存器。C 代码中的 <span class="mono">GPIOC-&gt;CRH</span> 就是在访问对应地址。</p><p><b>控制寄存器：</b>保存模式、速度与复用配置。<b>数据寄存器：</b>读取引脚或保存输出状态。<b>置位/复位寄存器：</b>用单次写操作改变输出位。</p><p>HAL 把检查、掩码和系列差异封装起来，最后仍然写这些硬件寄存器。</p></div><div class="callout"><b>学习目的：</b>理解寄存器是为了读懂生成代码和定位故障，不要求所有项目都手写寄存器。</div></section>
