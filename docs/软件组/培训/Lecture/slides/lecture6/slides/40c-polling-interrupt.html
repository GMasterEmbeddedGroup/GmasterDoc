<section><div class="slide-head"><h2 class="slide-title">轮询与中断</h2><p class="lead">轮询由程序主动检查状态，中断由硬件在事件发生时通知 CPU。</p></div><table class="mode-table"><thead><tr><th>比较</th><th>轮询 Polling</th><th>中断 Interrupt</th></tr></thead><tbody><tr><td>触发方式</td><td>主循环反复读取引脚</td><td>硬件检测事件并提出请求</td></tr><tr><td>无事件时</td><td>仍然执行检查代码</td><td>CPU 可以执行其他任务</td></tr><tr><td>响应时间</td><td>取决于轮询周期</td><td>受优先级和关中断时间影响</td></tr><tr><td>适用情况</td><td>状态保持较久、程序简单</td><td>短脉冲、异步通信、定时与故障</td></tr></tbody></table><div class="explain"><p>中断不会让单核 CPU 真正同时执行两段程序。CPU 只是暂停当前程序，短暂执行中断服务函数，再回到断点继续运行。</p></div><div class="error-box"><b>选择原则：</b>按键既可轮询也可中断。学习时先用轮询验证电路，再使用 EXTI 理解硬件通知链路。</div></section>
