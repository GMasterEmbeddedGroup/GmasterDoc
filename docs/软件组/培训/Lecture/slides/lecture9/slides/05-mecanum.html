<section>
  <div class="slide-head">
    <h2 class="slide-title">麦克纳姆轮底盘（麦轮底盘）</h2>
    <p class="lead">触地点形成矩形，四个轮面同向——但滚子方向决定了它有两种装法。</p>
  </div>
  <div class="figrow three tall">
    <figure><img src="img/mecanum-top.png" alt="麦轮底盘俯视图"><figcaption><b>俯视图</b>：正确装法在这里应看到“打叉”的滚子</figcaption></figure>
    <figure><img src="img/mecanum-iso.png" alt="麦轮底盘等轴测视图"><figcaption><b>等轴测视图</b>：四个轮组的辊子轴线同向布置</figcaption></figure>
    <figure><img src="img/mecanum-bottom.png" alt="麦轮底盘仰视图"><figcaption><b>仰视图</b>：正确装法在这里应看到“画圆”</figcaption></figure>
  </div>
  <div class="flip">
    <div class="no"><b>装反了</b>只能平动，转动会打滑：四个轮子对转矩的贡献互相抵消。</div>
    <div class="yes"><b>正确装法</b>俯视打叉、仰视画圆。装车前抬头看一遍，比调参数省事得多。</div>
  </div>
</section>
