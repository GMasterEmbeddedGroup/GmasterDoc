<section><div class="slide-head"><h2 class="slide-title">版本控制解决什么问题</h2><p class="lead">Git 为项目保存可说明、可比较、可恢复的历史。</p></div><div class="grid grid-2"><div class="card"><h4><span class="card-index">01</span>发生了什么</h4><p>比较文件改动，查看谁在何时修改了哪一行。</p></div><div class="card"><h4><span class="card-index">02</span>为什么修改</h4><p>提交信息把一组相关改动和原因绑定在一起。</p></div><div class="card"><h4><span class="card-index">03</span>怎样并行</h4><p>每项任务使用独立分支，完成后再合并。</p></div><div class="card"><h4><span class="card-index">04</span>如何恢复</h4><p>从已知提交找回文件，或用新提交撤销旧提交。</p></div></div><div class="callout"><b>Git 不等于 GitHub。</b>Git 是本地版本控制工具；GitHub 托管远程仓库并提供 PR、评审与权限管理。</div></section>
