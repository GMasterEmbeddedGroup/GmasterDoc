<section>
  <div class="slide-head">
    <h2 class="slide-title">全向轮底盘</h2>
    <p class="lead">触地点形成矩形，每个轮面与正交方向夹角 45°。</p>
  </div>
  <div class="figrow three tall">
    <figure><img src="img/omni-top.png" alt="全向轮底盘俯视图"><figcaption><b>俯视图</b>：滚子轴线两两对称布置</figcaption></figure>
    <figure><img src="img/omni-iso.png" alt="全向轮底盘等轴测视图"><figcaption><b>等轴测视图</b>：每个轮面与正交方向成 45°</figcaption></figure>
    <figure><img src="img/omni-bottom.png" alt="全向轮底盘仰视图"><figcaption><b>仰视图</b>：滚子朝向决定自由平移方向</figcaption></figure>
  </div>
  <div class="kv"><b>对称布置</b><span>左上 / 右下同向，右上 / 左下反向。装反了这个对称，平动就会跑偏。</span></div>
  <div class="kv"><b>为什么打滑</b><span>滚子磨损、底盘不平、地面有缝都会打滑；全向轮对小台阶最敏感。</span></div>
</section>
