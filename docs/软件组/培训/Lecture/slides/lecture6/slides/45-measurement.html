<section><div class="slide-head"><h2 class="slide-title">用仪器确认真实引脚状态</h2><p class="lead">调试 GPIO 不能只看变量窗口，还要测量焊盘上的电压与波形。</p></div><div class="why-line"><b>万用表</b><span>确认静态高低电平、供电和共地；不适合观察快速脉冲。</span></div><div class="why-line"><b>示波器</b><span>观察边沿、频率、抖动、振铃和短暂毛刺。</span></div><div class="why-line"><b>逻辑分析仪</b><span>长时间捕获数字状态，适合按键、SPI 和 UART 时序。</span></div><div class="error-box">探头地必须接系统 GND。不要把普通台式示波器地夹接到非地节点。</div></section>
