<section class="l7-page"><div class="eyebrow">GMASTER / LECTURE 7</div><h2>工程思维：先分析，再综合</h2><p class="lead">分析是综合的基础，综合是分析的先导</p><p>以考核为例，把整个程序拆成可以单独验证的部分。</p><ol class="steps"><li>先确定 PWM 能不能亮</li><li>确定串口能不能发</li><li>确定串口能不能收</li><li>确定十六进制计算是不是正确</li><li><strong>综合：完成整个程序</strong></li></ol><div class="callout">每一步先看到可验证的结果，再把各部分接起来。</div><footer>原 PPT 第 5 页</footer></section>
