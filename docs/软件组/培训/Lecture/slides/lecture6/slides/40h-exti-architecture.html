<section><div class="slide-head"><h2 class="slide-title">EXTI 检测边沿并产生请求</h2><p class="lead">EXTI 是 External Interrupt/Event Controller，连接外部输入、边沿检测、中断路径和事件路径。</p></div><img class="schematic" src="img/exti-internal-structure.png" alt="EXTI 内部结构"><div class="photo-caption">EXTI 内部中断路径与事件路径</div><div class="why-line"><b>边沿</b><span>0 变 1 是上升沿，1 变 0 是下降沿。上拉按键按下通常产生下降沿。</span></div><div class="why-line"><b>中断路径</b><span>IMR 允许后，请求进入 NVIC，CPU 执行 ISR。</span></div><div class="why-line"><b>事件路径</b><span>EMR 允许后，产生硬件事件，不要求 CPU 执行 ISR。</span></div></section>
