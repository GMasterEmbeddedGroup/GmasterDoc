<section><div class="slide-head"><h2 class="slide-title">HAL 与 CubeMX 分别做什么</h2><p class="lead">CubeMX 负责生成初始化代码，HAL 提供运行时调用接口，两者解决的问题不同。</p></div><div class="explain-grid"><div class="explain"><h3>STM32CubeMX</h3><p>图形化选择芯片、引脚、时钟和外设参数，随后生成 C 工程。它把配置保存进 <span class="mono">.ioc</span> 文件。</p><p>重新生成可能覆盖非 USER CODE 区域，业务逻辑应放在用户区域或独立文件。</p></div><div class="explain"><h3>HAL</h3><p>Hardware Abstraction Layer，硬件抽象层。它用统一函数封装寄存器操作，例如初始化、读引脚和写引脚。</p><p>HAL 提高可读性，但仍需理解电路、模式和初始化顺序。</p></div></div><div class="callout">课程先解释寄存器含义，再看 CubeMX 如何生成同样的配置。</div></section>
