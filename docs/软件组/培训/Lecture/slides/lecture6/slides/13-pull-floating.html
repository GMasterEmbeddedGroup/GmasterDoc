<section><div class="slide-head"><h2 class="slide-title">上拉、下拉与浮空</h2><p class="lead">输入阻抗很高。没有电阻固定电位时，人体、电线和邻近信号都可能改变读数。</p></div><table class="mode-table"><tr><th>状态</th><th>未连接时</th><th>用途</th></tr><tr><td>浮空</td><td>没有确定值，容易跳变</td><td>外部电路始终强驱动</td></tr><tr><td>上拉</td><td>默认为 1</td><td>按键接地、开漏信号</td></tr><tr><td>下拉</td><td>默认为 0</td><td>按键接 3.3 V</td></tr></table><div class="error-box"><b>诊断：</b>输入乱跳时先测电压并检查拉电阻，不要用延时掩盖浮空问题。</div></section>
