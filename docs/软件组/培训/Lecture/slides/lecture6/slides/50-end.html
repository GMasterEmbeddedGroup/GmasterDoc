<section><div class="slide-head"><h2 class="slide-title">GPIO 开发检查清单</h2><p class="lead">先看原理图，再配模式，最后用仪器验证焊盘。</p></div><div class="explain-grid"><div class="explain"><h3>接线前</h3><p>确认物理脚号、3.3 V/5 V 条件、共地、限流电阻和负载电流。</p><h3>配置时</h3><p>确认端口时钟、模式、上下拉、速度、初始电平、AFIO 与 SWD。</p></div><div class="explain"><h3>运行后</h3><p>先读 status/变量，再用万用表或示波器测引脚；输入异常优先检查浮空和抖动。</p><h3>官方资料</h3><p>RM0008、STM32F103x8/xB Datasheet、STM32CubeF1 HAL GPIO Driver、AN4899。</p></div></div><div class="callout"><b>最终目标：</b>能够从原理图判断电平极性，从 CubeMX 配置追到寄存器，并独立定位“软件正确但引脚不工作”的原因。</div></section>
