<section><div class="slide-head"><h2 class="slide-title">IDR 与 ODR</h2><p class="lead">IDR 读取焊盘当前电平，ODR 保存输出锁存值；两者回答的问题不同。</p></div><div class="explain-grid"><div class="explain"><h3>GPIOx_IDR</h3><p><span class="mono">(GPIOA-&gt;IDR &amp; (1&lt;&lt;0))</span> 读取 PA0 的真实输入电平。输出模式下也可用 IDR观察焊盘。</p></div><div class="explain"><h3>GPIOx_ODR</h3><p>记录希望输出的状态。F103 输入上拉/下拉模式还借用 ODR 位选择方向。</p></div></div><div class="error-box">直接对 ODR 做读改写可能被中断打断。单个或多个位的原子置位/复位优先使用 BSRR。</div></section>
