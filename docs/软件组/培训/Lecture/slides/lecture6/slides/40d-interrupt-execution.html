<section><div class="slide-head"><h2 class="slide-title">一次中断怎样执行</h2><p class="lead">中断源提出请求后，CPU 保存必要现场，执行 ISR，再恢复被打断的程序。</p></div><img class="schematic" src="img/stm32-interrupt-overview.png" alt="STM32 中断系统总览"><div class="photo-caption">中断源经过外设或 EXTI、NVIC 和内核后进入中断服务函数</div><div class="why-line"><b>1 请求</b><span>GPIO、定时器或串口置位自己的状态标志，并向 NVIC 提出 IRQ。</span></div><div class="why-line"><b>2 响应</b><span>NVIC 判断使能和优先级。CPU 保存返回地址与部分核心寄存器。</span></div><div class="why-line"><b>3 服务与返回</b><span>CPU 执行中断服务函数 ISR，处理完成后恢复现场，从断点附近继续运行。</span></div></section>
