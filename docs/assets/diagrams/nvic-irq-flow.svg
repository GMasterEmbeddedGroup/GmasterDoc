<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="ttl dsc" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title id="ttl">NVIC 与外设中断</title>
  <desc id="dsc">CAN/UART/TIM 等外设的中断信号进入 NVIC 的 IRQ0…IRQn，经优先级仲裁与嵌套管理后交给 CPU 核心执行。</desc>
    <rect x="0.75" y="0.75" width="958.5" height="498.5" rx="14" fill="#f7f9fc" stroke="#dce3ec" stroke-width="1.5"/>
    <rect x="60" y="20" width="840" height="340" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="480" y="52" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Cortex-M4 内核</text>
    <rect x="100" y="72" width="760" height="212" rx="12" fill="#f4f1ff" stroke="#a99bea" stroke-width="1.5"/>
    <text x="480" y="100" font-size="15" font-weight="700" fill="#4b3f9e" text-anchor="middle">NVIC</text>
    <rect x="130" y="120" width="90" height="46" rx="9" fill="#ffffff" stroke="#a99bea" stroke-width="1.4"/>
    <text x="175" y="139" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">IRQ0</text>
    <line x1="175" y1="166" x2="175" y2="196" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="235" y="120" width="90" height="46" rx="9" fill="#ffffff" stroke="#a99bea" stroke-width="1.4"/>
    <text x="280" y="139" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">IRQ1</text>
    <line x1="280" y1="166" x2="280" y2="196" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="340" y="120" width="90" height="46" rx="9" fill="#ffffff" stroke="#a99bea" stroke-width="1.4"/>
    <text x="385" y="139" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">IRQ2</text>
    <line x1="385" y1="166" x2="385" y2="196" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="610" y="120" width="90" height="46" rx="9" fill="#ffffff" stroke="#a99bea" stroke-width="1.4"/>
    <text x="655" y="139" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">IRQn</text>
    <line x1="655" y1="166" x2="655" y2="196" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <text x="505" y="155" font-size="18" font-weight="400" fill="#4b3f9e" text-anchor="middle">…</text>
    <line x1="175" y1="196" x2="655" y2="196" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="480" y1="196" x2="480" y2="216" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <text x="480" y="236" font-size="13" font-weight="700" fill="#4b3f9e" text-anchor="middle">优先级仲裁 + 嵌套管理</text>
    <line x1="480" y1="244" x2="480" y2="268" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 480 244 L 480 282" stroke="#7b6bd6" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <path d="M 480 282 L 475.66 275 L 484.34 275 z" fill="#7b6bd6"/>
    <rect x="390" y="286" width="180" height="44" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="480" y="304" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">CPU 核心</text>
    <rect x="200" y="392" width="160" height="48" rx="9" fill="#ffffff" stroke="#e2b862" stroke-width="1.4"/>
    <text x="280" y="412" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">CAN RX</text>
    <path d="M 280 392 L 280 360" stroke="#d9a441" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <path d="M 280 360 L 275.66 367 L 284.34 367 z" fill="#d9a441"/>
    <rect x="400" y="392" width="160" height="48" rx="9" fill="#ffffff" stroke="#e2b862" stroke-width="1.4"/>
    <text x="480" y="412" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">UART</text>
    <path d="M 480 392 L 480 360" stroke="#d9a441" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <path d="M 480 360 L 475.66 367 L 484.34 367 z" fill="#d9a441"/>
    <rect x="600" y="392" width="160" height="48" rx="9" fill="#ffffff" stroke="#e2b862" stroke-width="1.4"/>
    <text x="680" y="412" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">TIM IRQ</text>
    <path d="M 680 392 L 680 360" stroke="#d9a441" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <path d="M 680 360 L 675.66 367 L 684.34 367 z" fill="#d9a441"/>
    <text x="790" y="424" font-size="12" font-weight="400" fill="#8a93a3" text-anchor="start">← 外设中断信号</text>
</svg>
