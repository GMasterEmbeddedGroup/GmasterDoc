<section><div class="slide-head"><h2 class="slide-title">推挽输出</h2><p class="lead">P-MOS 主动拉高，N-MOS 主动拉低，两个方向都有较低输出阻抗。</p></div><div class="state-flow"><div class="state-box"><h4>输出 1</h4><p>上管导通，引脚接近 VDD。</p></div><div class="state-change">互斥</div><div class="state-box"><h4>输出 0</h4><p>下管导通，引脚接近 GND。</p></div></div><div class="explain"><p>适合 LED、片选、复位和使能。两个推挽输出不能直接相连并输出相反电平，否则会产生争用电流。</p></div><div class="codebox"><pre><code>GPIO_InitStruct.Mode = GPIO_MODE_OUTPUT_PP;</code></pre></div></section>
