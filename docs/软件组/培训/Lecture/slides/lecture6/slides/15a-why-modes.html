<section><div class="slide-head"><h2 class="slide-title">工作模式决定引脚内部开关</h2><p class="lead">同一个焊盘连接多条内部路径。模式告诉芯片保留哪些路径、关闭哪些路径以及谁控制输出。</p></div><div class="why-line"><b>输入模式</b><span>外部电路决定电压，数字输入缓冲器把电压判断为 0 或 1。</span></div><div class="why-line"><b>输出模式</b><span>GPIO 输出锁存器控制内部晶体管，主动拉高、拉低或只拉低。</span></div><div class="why-line"><b>模拟模式</b><span>关闭数字输入缓冲器，把焊盘交给 ADC 等模拟外设，减少数字电路干扰。</span></div><div class="why-line"><b>复用模式</b><span>USART、SPI 或定时器接管输出，GPIO 仍负责电气类型和速度。</span></div><div class="callout">“八种模式”是输入路径、输出结构和控制来源的组合，不是八个互不相关的名字。</div></section>
