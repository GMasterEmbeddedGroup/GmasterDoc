<section><div class="slide-head"><h2 class="slide-title">电压、电流与地</h2><p class="lead">GPIO 的 0 和 1 最终由真实电路中的电压决定，输出负载则会形成电流。</p></div><div class="explain-grid"><div class="explain"><h3>电压是两点之间的差</h3><p>说“PA0 是 3.3 V”通常表示 PA0 相对系统 GND 的电压约为 3.3 V。没有共同参考地，两块板对高低电平的理解可能不同。</p><p>万用表测电压时，黑表笔接 GND，红表笔接被测引脚。</p></div><div class="explain"><h3>电流需要闭合回路</h3><p>LED 点亮时，电流从电源出发，经过 LED 和限流电阻，再回到地。GPIO 可以提供电流，也可以吸收电流。</p><p>负载越重，GPIO 输出电压偏离理想 0 V 或 3.3 V 的程度越大。</p></div></div><div class="error-box"><b>常见错误：</b>只连接信号线而没有共地，输入电平会失去可靠参考。</div></section>
