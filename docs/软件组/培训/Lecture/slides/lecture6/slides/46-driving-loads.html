<section><div class="slide-head"><h2 class="slide-title">GPIO 不能直接驱动大负载</h2><p class="lead">电机、继电器、电磁阀和大功率 LED 需要功率级，GPIO 只提供控制信号。</p></div><div class="terminal">GPIO ─ 栅极电阻 ─ MOSFET ─ 负载<br>                    │<br>                 续流二极管（感性负载）</div><div class="explain"><p>MOSFET 选择要检查逻辑电平导通、栅极电荷、漏极电流和散热。感性负载关断时需要续流路径。</p><p>负载电源与 MCU 电源可以不同，但控制接口通常需要共地或隔离。</p></div><div class="error-box">GPIO 直接接电机不仅无法正常驱动，还可能因过流和反向电压损坏 MCU。</div></section>
