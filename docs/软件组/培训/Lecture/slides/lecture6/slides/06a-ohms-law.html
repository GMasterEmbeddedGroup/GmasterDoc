<section><div class="slide-head"><h2 class="slide-title">电阻、限流与欧姆定律</h2><p class="lead">电阻限制电流。GPIO 驱动 LED 时必须串联限流电阻，避免 LED 和芯片过流。</p></div><div class="explain-grid"><div class="explain"><h3>欧姆定律</h3><p><span class="mono">I = U / R</span>。电流等于电阻两端电压除以电阻值。</p><p>3.3 V 电源、LED 压降约 2.0 V、串联 510 Ω 时，估算电流为 <span class="mono">(3.3−2.0)/510 ≈ 2.5 mA</span>。</p></div><div class="explain"><h3>为什么只是估算</h3><p>LED 压降、GPIO 输出电压和电阻值都有误差。精确设计要查数据手册，并留出温度和批次裕量。</p><p>电阻增大时 LED 变暗但电流减小。不能用短路替代限流电阻。</p></div></div><div class="callout">Blue Pill 板载 LED 使用 510 Ω 电阻，因此 PC13 只需吸收几毫安电流。</div></section>
