<section><div class="slide-head"><h2 class="slide-title">Git 的四个区域</h2><p class="lead">大多数命令只是把改动或提交从一个区域移动到另一个区域。</p></div><div class="zones"><div class="zone"><b>工作区</b>正在编辑的文件<br><span class="mono">git diff</span></div><div class="zone"><b>暂存区</b>下一次提交的清单<br><span class="mono">git add</span></div><div class="zone"><b>本地仓库</b>已经保存的提交<br><span class="mono">git commit</span></div><div class="zone"><b>远程仓库</b>团队共享的引用<br><span class="mono">git push</span></div></div><div class="pipeline"><div class="node">工作区</div><span class="arrow">add →</span><div class="node hot">暂存区</div><span class="arrow">commit →</span><div class="node">本地仓库</div><span class="arrow">push →</span><div class="node">远程仓库</div></div><div class="callout"><b>commit 不会自动上传。</b>它先写入本地仓库；push 才把本地提交发送到远程。</div></section>
