<section><div class="slide-head"><h2 class="slide-title">开漏输出</h2><p class="lead">内部只保留下拉 N-MOS。输出 0 时拉低，输出 1 时释放为高阻。</p></div><div class="terminal">VDD ─ Rpullup ─┬─ GPIO A (open-drain)<br>               └─ GPIO B (open-drain)</div><div class="explain"><p>线路为高电平依赖外部或内部上拉。任意器件拉低，整条线都为低，因此多个器件可安全共享。</p><p>I²C 使用复用开漏。内部上拉通常较弱，高速总线一般需要按电容和时序计算外部上拉。</p></div><div class="error-box">没有上拉时，开漏“输出 1”只是释放线路，电压可能一直浮空。</div></section>
