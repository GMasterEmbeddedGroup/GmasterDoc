<section><div class="slide-head"><h2 class="slide-title">log 与 show：阅读项目历史</h2><p class="lead">提交哈希是快照的唯一标识，通常只需输入不冲突的前几位。</p></div><div class="terminal"><span class="prompt">$</span> git log --oneline --graph --decorate --all<br>* a1b2c3d (HEAD -&gt; dev/cmake-demo) add calc library target<br>* 71fe220 (origin/main, main) add starter project<br><br><span class="prompt">$</span> git show a1b2c3d<br><span class="prompt">$</span> git show a1b2c3d:CMakeLists.txt</div><div class="callout"><b>HEAD</b> 表示当前检出的提交；分支名是一个会随新提交向前移动的指针。</div></section>
