<section><div class="slide-head"><h2 class="slide-title">GPIO 常见错误</h2><p class="lead">按“电路、供电、配置、程序”顺序排查，避免一开始就改大量代码。</p></div><table class="mode-table"><tr><th>现象</th><th>优先检查</th></tr><tr><td>LED 逻辑反了</td><td>原理图是否低电平有效</td></tr><tr><td>引脚始终不变</td><td>端口时钟、模式、物理脚号、焊接与共地</td></tr><tr><td>输入乱跳</td><td>浮空、上下拉、线缆干扰</td></tr><tr><td>EXTI 不进入</td><td>边沿、AFIO 映射、NVIC、IRQHandler</td></tr><tr><td>下载器失联</td><td>是否关闭 SWD 或复用了 PA13/PA14</td></tr><tr><td>输出波形畸变</td><td>负载过重、速度设置、走线和探头接法</td></tr></table></section>
