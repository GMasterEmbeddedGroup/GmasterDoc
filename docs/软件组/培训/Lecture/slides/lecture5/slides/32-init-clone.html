<section><div class="slide-head"><h2 class="slide-title">init 与 clone</h2><p class="lead">一个从现有目录开始，一个从远程仓库开始。</p></div><div class="compare"><div><h4>git init</h4><div class="terminal">mkdir demo<br>cd demo<br>git init</div><p>在当前目录创建 <span class="mono">.git</span>，适合新项目。它不会自动产生第一次提交。</p></div><div><h4>git clone</h4><div class="terminal">git clone &lt;repository-url&gt;<br>cd &lt;repository-name&gt;</div><p>下载完整历史、创建工作区，并默认把来源命名为 <span class="mono">origin</span>。</p></div></div><div class="callout"><b>已有远程仓库就 clone。</b>不要先下载 ZIP、再在里面 init，那样会丢失历史和远程配置。</div></section>
