<section><div class="slide-head"><h2 class="slide-title">模式选择方法</h2><p class="lead">先回答谁驱动线路、默认电平是什么、是否由片上外设控制。</p></div><div class="why-line"><b>读取模拟量</b><span>模拟输入，交给 ADC。</span></div><div class="why-line"><b>读取主动数字输出</b><span>浮空输入；若外部可能高阻，再增加合适上拉或下拉。</span></div><div class="why-line"><b>普通控制信号</b><span>通用推挽输出，速度按实际需要选择。</span></div><div class="why-line"><b>共享/线与信号</b><span>开漏输出并提供上拉。</span></div><div class="why-line"><b>USART/SPI/PWM/I²C</b><span>选择复用模式，并确认推挽、开漏与 AFIO 重映射。</span></div></section>
