<section><div class="slide-head"><h2 class="slide-title">Git 实操与随堂小测</h2><p class="lead">你只想取消暂存 CMakeLists.txt，但保留文件中的修改，应使用哪条命令？</p></div><div class="quiz"><button class="quiz-opt" data-explain="这会丢弃工作区修改，不符合保留内容的要求。">A. git restore CMakeLists.txt</button><button class="quiz-opt" data-correct="1" data-explain="--staged 只把内容从暂存区退回工作区。">B. git restore --staged CMakeLists.txt</button><button class="quiz-opt" data-explain="commit 会保存当前暂存内容，不是取消暂存。">C. git commit</button><button class="quiz-opt" data-explain="push 与本地暂存区无关。">D. git push</button><div class="quiz-feedback"></div></div><div class="lab"><h3>5 分钟实操</h3><ol><li>在 starter 目录运行 <span class="mono">git init</span> 并创建首次提交。</li><li>建立 <span class="mono">dev/message</span> 分支，修改输出内容。</li><li>使用 status、diff、add、diff --staged 检查后提交。</li></ol></div></section>
