<section><div class="slide-head"><h2 class="slide-title">AFIO 选择 EXTI 的 GPIO 来源</h2><p class="lead">EXTI0–15 按引脚编号组织，同一编号的不同端口必须共享一条 EXTI 线。</p></div><div class="explain-grid"><div><img class="schematic" src="img/exti-port-routing.png" alt="GPIO 经过 AFIO 接入 EXTI"><div class="photo-caption">GPIO 端口经过 AFIO 路由到 EXTI</div></div><div><img class="schematic" src="img/exti-line-multiplexing.png" alt="同编号 GPIO 共享 EXTI 线"><div class="photo-caption">PA0、PB0、PC0 等只能选择一个接入 EXTI0</div></div></div><div class="circuit-note"><b>AFIO</b> 是 Alternate Function I/O。<span class="mono">AFIO_EXTICR1–4</span> 选择端口来源；配置前要使能 AFIO 时钟。PA0 与 PB0 不能同时作为两个独立的 EXTI0 中断源。</div></section>
