<section><div class="slide-head"><h2 class="slide-title">Blue Pill 最小系统板原理图</h2><p class="lead">原理图把引脚名、供电、LED、晶振、复位和调试接口连接在一起。</p></div><img class="schematic tall" src="img/bluepill-schematic.png" alt="STM32F103C8T6 Blue Pill 原理图"><div class="photo-caption">原始 Blue Pill 原理图镜像，重点观察 PC13 与 D2、SWDIO/SWCLK、BOOT0/BOOT1 和 3.3 V 供电</div><div class="circuit-note">板载可编程 LED D2 从 3.3 V 经 LED 与 510 Ω 电阻接到 PC13，因此 PC13 输出低电平时电流流入 MCU，LED 点亮。</div><p class="source">来源：STM32-base 开源资料库，original-schematic-STM32F103C8T6-Blue_Pill.pdf。</p></section>
