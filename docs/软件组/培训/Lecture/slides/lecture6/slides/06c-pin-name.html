<section><div class="slide-head"><h2 class="slide-title">GPIO 引脚名称的读法</h2><p class="lead">STM32 用“端口字母 + 端口内编号”命名 GPIO，例如 PA0、PB12、PC13。</p></div><div class="register"><span class="hot">P</span><span class="hot">C</span><span class="hot">13</span><span>GPIO</span><span>端口 C</span><span>第 13 位</span><span>位掩码</span><span>1&lt;&lt;13</span></div><div class="explain"><p><b>端口字母：</b>A、B、C 对应不同 GPIO 外设，各自拥有独立配置与数据寄存器。</p><p><b>编号：</b>0–15 表示端口内部的位。HAL 用 <span class="mono">GPIO_PIN_13</span> 表示 <span class="mono">1u &lt;&lt; 13</span>。</p><p><b>标签：</b>CubeMX 可以把 PC13 取名为 LED。标签改善可读性，但不会改变真实引脚。</p></div><div class="error-box">PA13 与封装第 13 脚不是一回事，接线前必须查封装 pinout。</div></section>
