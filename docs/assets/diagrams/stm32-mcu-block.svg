<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="ttl dsc" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <title id="ttl">STM32 MCU 内部结构</title>
  <desc id="dsc">Cortex-M4 内核与 Flash 挂在总线矩阵上，总线矩阵下接 RAM、GPIO、UART 以及 SPI/I2C/CAN/TIM 等外设。</desc>
    <rect x="0.75" y="0.75" width="958.5" height="450.5" rx="14" fill="#f7f9fc" stroke="#dce3ec" stroke-width="1.5"/>
    <rect x="60" y="20" width="840" height="412" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="480" y="52" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">STM32 MCU</text>
    <rect x="92" y="74" width="300" height="78" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="242" y="109" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">Cortex-M4 内核</text>
    <rect x="412" y="74" width="456" height="78" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="640" y="100" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">Flash (512KB)</text>
    <text x="640" y="118" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">程序存储</text>
    <line x1="242" y1="152" x2="242" y2="188" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="92" y="188" width="776" height="56" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <text x="480" y="212" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">总线矩阵（Bus Matrix）</text>
    <line x1="242" y1="244" x2="242" y2="280" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="148" y1="280" x2="812" y2="280" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="92" y="300" width="240" height="74" rx="9" fill="#ffffff" stroke="#7fcfc3" stroke-width="1.4"/>
    <text x="212" y="324" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">RAM 192KB</text>
    <text x="212" y="342" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">数据存储</text>
    <rect x="352" y="300" width="240" height="74" rx="9" fill="#ffffff" stroke="#7fcfc3" stroke-width="1.4"/>
    <text x="472" y="324" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">GPIO × N</text>
    <text x="472" y="342" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">引脚控制</text>
    <rect x="612" y="300" width="256" height="74" rx="9" fill="#ffffff" stroke="#7fcfc3" stroke-width="1.4"/>
    <text x="740" y="324" font-size="13" font-weight="700" fill="#1f2430" text-anchor="middle">UART</text>
    <text x="740" y="342" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">串口</text>
    <line x1="148" y1="280" x2="148" y2="300" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="472" y1="280" x2="472" y2="300" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="812" y1="280" x2="812" y2="300" stroke="#8b97b5" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="92" y="392" width="176" height="40" rx="9" fill="#ffffff" stroke="#e2b862" stroke-width="1.4"/>
    <text x="180" y="408" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">SPI</text>
    <rect x="288" y="392" width="176" height="40" rx="9" fill="#ffffff" stroke="#e2b862" stroke-width="1.4"/>
    <text x="376" y="408" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">I2C</text>
    <rect x="484" y="392" width="176" height="40" rx="9" fill="#ffffff" stroke="#e2b862" stroke-width="1.4"/>
    <text x="572" y="408" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">CAN</text>
    <rect x="680" y="392" width="176" height="40" rx="9" fill="#ffffff" stroke="#e2b862" stroke-width="1.4"/>
    <text x="768" y="408" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">TIM</text>
    <text x="480" y="388" font-size="12" font-weight="400" fill="#8a6212" text-anchor="middle">外设总线：SPI / I2C / CAN / TIM …</text>
</svg>
