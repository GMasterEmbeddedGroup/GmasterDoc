<section><div class="slide-head"><h2 class="slide-title">分支与 git switch</h2><p class="lead">每项任务从最新 main 创建独立分支，不直接在 main 上开发。</p></div><div class="terminal"><span class="prompt">$</span> git switch main<br><span class="prompt">$</span> git pull upstream main<br><span class="prompt">$</span> git switch -c dev/cmake-demo<br>Switched to a new branch 'dev/cmake-demo'<br><span class="prompt">$</span> git branch --show-current</div><div class="pipeline"><div class="node">main<br><span class="mono">A—B</span></div><span class="arrow">分支</span><div class="node hot">dev/cmake-demo<br><span class="mono">A—B—C—D</span></div></div><div class="callout"><b>分支很轻量。</b>它只是指向提交的名字；切换分支会让工作区匹配对应提交。</div></section>
