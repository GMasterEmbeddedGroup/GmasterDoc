<section><div class="slide-head"><h2 class="slide-title">小测与解析</h2><p class="lead">先作答，再用下方解析检查是否真正理解电路和寄存器。</p></div><div class="why-line"><b>1</b><span>PC13 写 RESET 为什么 LED 亮？答案：LED 从 3.3 V 接向 PC13，低电平形成电流回路。</span></div><div class="why-line"><b>2</b><span>F103 上拉/下拉由什么决定？答案：CNF/MODE 选择带拉输入，ODR 位选择上拉或下拉。</span></div><div class="why-line"><b>3</b><span>开漏输出 1 为什么测不到高电平？答案：输出 1 只是释放线路，缺少上拉。</span></div><div class="why-line"><b>4</b><span>为什么优先用 BSRR？答案：单次写操作原子修改目标位，不会覆盖其他引脚。</span></div><div class="why-line"><b>5</b><span>EXTI 为什么一次按键触发多次？答案：机械抖动，需要软件或硬件消抖。</span></div></section>
