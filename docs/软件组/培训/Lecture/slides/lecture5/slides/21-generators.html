<section><div class="slide-head"><h2 class="slide-title">生成器：Ninja、Make 与 Visual Studio</h2><p class="lead">生成器决定 CMake 产出哪一种构建规则。</p></div><table><thead><tr><th>生成器</th><th>特点</th><th>典型命令</th></tr></thead><tbody><tr><td>Ninja</td><td>轻量、输出简洁、跨平台，课程推荐</td><td><span class="mono">-G Ninja</span></td></tr><tr><td>Unix Makefiles</td><td>Linux 常见，需要 make</td><td><span class="mono">-G "Unix Makefiles"</span></td></tr><tr><td>Visual Studio</td><td>多配置生成器，可生成解决方案</td><td><span class="mono">-G "Visual Studio 17 2022"</span></td></tr></tbody></table><div class="terminal"><span class="prompt">$</span> cmake --help<br><span class="muted">Generators ...</span></div><div class="callout"><b>同一个 build 目录不要混用生成器。</b>需要切换时新建构建目录。</div></section>
