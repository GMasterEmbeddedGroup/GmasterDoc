<section><div class="slide-head"><h2 class="slide-title">CMake 在构建链路中的位置</h2><p class="lead">CMake 不编译代码，它生成构建规则，再由构建工具调用编译器。</p></div><div class="pipeline"><div class="node hot"><b>CMakeLists.txt</b>工程描述</div><span class="arrow">→</span><div class="node"><b>CMake</b>配置与生成</div><span class="arrow">→</span><div class="node"><b>Ninja / Make</b>安排任务</div><span class="arrow">→</span><div class="node"><b>GCC</b>编译与链接</div><span class="arrow">→</span><div class="node"><b>程序</b>exe / elf</div></div><div class="grid grid-3"><div class="card"><h4>编译器</h4><p>把一个个源文件变成目标文件，再由链接器组合成程序。</p></div><div class="card"><h4>构建工具</h4><p>记录依赖关系，只重做受改动影响的任务。</p></div><div class="card"><h4>CMake</h4><p>用统一描述生成不同平台需要的构建规则。</p></div></div><div class="callout"><b>记忆：</b>GCC 干活，Ninja 排活，CMake 写计划。</div></section>
