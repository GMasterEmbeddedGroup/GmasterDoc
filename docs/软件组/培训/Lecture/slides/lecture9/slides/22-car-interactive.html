<section>
  <div class="slide-head">
    <h2 class="slide-title">每个轮组的和矢量</h2>
    <p class="lead">拖三根滑条：黑箭头是车体平动，红箭头是该轮组叠加转动后的和矢量。</p>
  </div>
  <div class="car" data-car>
    <div class="car-stage">
      <svg viewBox="0 0 660 480" role="img" aria-label="底盘四个轮组的速度矢量">
        <defs>
          <marker id="car-arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b3121b"></path></marker>
          <marker id="car-arrow-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#14161a"></path></marker>
        </defs>
        <text x="330" y="98" text-anchor="middle" font-size="15" fill="#7c848f">前</text>
        <line x1="330" y1="141" x2="330" y2="108" stroke="#c3c9d1" stroke-width="1.2" stroke-dasharray="4 4"></line>
        <rect x="216" y="141" width="228" height="198" rx="12" fill="#f7f8fa" stroke="#8e9aa6" stroke-width="1.6"></rect>
        <rect x="426" y="132" width="36" height="18" fill="#e8eaed" stroke="#14161a" stroke-width="1.3"></rect>
        <rect x="426" y="330" width="36" height="18" fill="#e8eaed" stroke="#14161a" stroke-width="1.3"></rect>
        <rect x="198" y="330" width="36" height="18" fill="#e8eaed" stroke="#14161a" stroke-width="1.3"></rect>
        <rect x="198" y="132" width="36" height="18" fill="#e8eaed" stroke="#14161a" stroke-width="1.3"></rect>
        <line x1="314" y1="240" x2="346" y2="240" stroke="#c3c9d1" stroke-width="1"></line>
        <line x1="330" y1="224" x2="330" y2="256" stroke="#c3c9d1" stroke-width="1"></line>
        <circle cx="330" cy="240" r="3.5" fill="#14161a"></circle>
        <text x="298" y="258" font-size="12" fill="#7c848f">O</text>
        <text x="330" y="455" text-anchor="middle" font-size="12" fill="#7c848f">a = 0.30 m　b = 0.26 m</text>
        <g data-layer></g>
      </svg>
    </div>
    <div class="car-panel">
      <h4>手动输入底盘运动状态</h4>
      <div class="car-row"><label>vx</label><input type="range" data-k="vx" min="-2" max="2" step="0.05" value="1.00"><output>1.00</output></div>
      <div class="car-row"><label>vy</label><input type="range" data-k="vy" min="-2" max="2" step="0.05" value="0.00"><output>0.00</output></div>
      <div class="car-row"><label>ω</label><input type="range" data-k="w" min="-3" max="3" step="0.05" value="0.00"><output>0.00</output></div>
      <div class="car-out" data-car-out></div>
      <p class="car-formula">\(v_0 = v + \omega \times r\)，四个轮组位置 \(r=(\pm a,\pm b)\)。单位：v 为 m/s，ω 为 rad/s。</p>
    </div>
  </div>
</section>
