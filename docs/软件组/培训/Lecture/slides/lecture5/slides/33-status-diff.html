<section><div class="slide-head"><h2 class="slide-title">status 与 diff：提交前先检查</h2><p class="lead">养成固定顺序：看状态、看内容、再暂存。</p></div><div class="terminal"><span class="prompt">$</span> git status --short<br> M CMakeLists.txt<br>?? src/calc.c<br><br><span class="prompt">$</span> git diff<br><span class="muted"># 查看尚未暂存的逐行修改</span><br><span class="prompt">$</span> git diff --staged<br><span class="muted"># 查看下一次提交将包含什么</span></div><table><thead><tr><th>标记</th><th>含义</th></tr></thead><tbody><tr><td><span class="mono">??</span></td><td>Git 尚未跟踪的新文件</td></tr><tr><td><span class="mono"> M</span></td><td>工作区已修改，尚未暂存</td></tr><tr><td><span class="mono">M </span></td><td>修改已进入暂存区</td></tr></tbody></table></section>
