<section><div class="slide-head"><h2 class="slide-title">git merge：汇合两条历史</h2><p class="lead">先切到接收改动的分支，再合并来源分支。</p></div><div class="terminal"><span class="prompt">$</span> git switch main<br><span class="prompt">$</span> git merge dev/cmake-demo</div><div class="grid grid-2"><div class="card"><h4>Fast-forward</h4><p>main 没有新提交，只需把指针向前移动。</p><p class="mono">A—B—C—D</p></div><div class="card"><h4>Merge commit</h4><p>两边都前进时，Git 创建一个同时拥有两个父提交的新提交。</p><p class="mono">A—B—C<br>　＼D—M</p></div></div><div class="callout"><b>合并前先构建和测试。</b>Git 能合并文本，不知道程序逻辑是否正确。</div></section>
