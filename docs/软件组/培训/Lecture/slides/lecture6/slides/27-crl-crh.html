<section><div class="slide-head"><h2 class="slide-title">CRL 与 CRH：每个引脚 4 位配置</h2><p class="lead">CRL 管 pin 0–7，CRH 管 pin 8–15；每个引脚由 CNF[1:0] 和 MODE[1:0] 描述。</p></div><div class="register"><span>CNF7</span><span>MODE7</span><span>…</span><span>CNF1</span><span>MODE1</span><span class="hot">CNF0</span><span class="hot">MODE0</span><span>CRL</span></div><div class="explain"><p>例如 PC13 位于 CRH，对应偏移 <span class="mono">(13 - 8) × 4 = 20</span>。先清除这 4 位，再写入新的 CNF/MODE。</p><p>修改时要保留同端口其他引脚，因此使用掩码读改写；BSRR 用于输出电平时则无需读改写。</p></div></section>
