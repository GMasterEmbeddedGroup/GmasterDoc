<section class="l7-page"><div class="eyebrow">GMASTER / LECTURE 7</div><h2>复习：开漏输出如何获得高电平</h2><article class="question"><p><span class="qno">8</span>普通开漏输出不启用内部上拉。若需获得稳定高电平，通常应：<small>A. 在引脚与地之间连接下拉电阻<br>B. 只向输出寄存器写 1，无需外部电路<br>C. 通过电阻将引脚上拉至允许的电源电压<br>D. 将引脚与地直接连接</small></p><details class="answer"><summary>查看答案与解析</summary><div><b>C。</b>开漏输出写 1 时关闭下拉晶体管，引脚处于高阻态。上拉电阻提供高电平路径。</div></details></article><div class="callout">写 0：主动拉低<br>写 1：释放引脚，由上拉电阻拉高</div><footer>原 PPT 第 2 页</footer></section>
