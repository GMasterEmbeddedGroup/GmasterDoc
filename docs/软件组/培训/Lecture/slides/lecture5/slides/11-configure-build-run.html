<section><div class="slide-head"><h2 class="slide-title">配置、构建与运行</h2><p class="lead">三步对应三类问题。报错时先确认自己卡在哪一步。</p></div><div class="stepper" data-stepper><div class="step-rail"><button class="step-item"><span class="step-idx">01</span>配置</button><button class="step-item"><span class="step-idx">02</span>构建</button><button class="step-item"><span class="step-idx">03</span>运行</button></div><div class="step-stage"><div class="step-panel"><h4>读取工程并检测工具链</h4><div class="terminal">cmake -S . -B build -G Ninja</div><p>这里常见语法错误、找不到编译器或生成器。</p></div><div class="step-panel"><h4>调用构建工具与编译器</h4><div class="terminal">cmake --build build</div><p>这里常见 C 语法错误、缺头文件和链接失败。</p></div><div class="step-panel"><h4>执行生成物</h4><div class="terminal">./build/hello.exe</div><p>程序能启动但结果不对，才进入运行逻辑的排查。</p></div></div></div></section>
