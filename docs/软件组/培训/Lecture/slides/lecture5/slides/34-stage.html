<section><div class="slide-head"><h2 class="slide-title">git add：选择下一次提交</h2><p class="lead">暂存区让你从一堆本地修改中挑出逻辑完整的一组。</p></div><div class="terminal"><span class="prompt">$</span> git add CMakeLists.txt src/calc.c<br><span class="prompt">$</span> git diff --staged<br><span class="prompt">$</span> git status</div><div class="grid grid-2"><div class="card"><h4>按文件暂存</h4><p><span class="mono">git add &lt;file&gt;</span> 清楚、安全，适合新手。</p></div><div class="card"><h4>按片段暂存</h4><p><span class="mono">git add -p</span> 可把同一文件中的不同任务拆到不同提交。</p></div></div><div class="callout warn"><b>git add . 不是禁用命令。</b>运行前必须先用 status/diff 确认没有 build、密钥、日志或无关修改。</div></section>
