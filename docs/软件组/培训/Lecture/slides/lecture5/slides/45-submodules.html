<section><div class="slide-head"><h2 class="slide-title">Git 子模块</h2><p class="lead">父仓库记录的是子仓库的特定提交，不是子仓库全部文件的普通副本。</p></div><div class="terminal"><span class="prompt">$</span> git clone --recurse-submodules &lt;url&gt;<br><br><span class="muted"># 已经普通 clone 后补齐</span><br><span class="prompt">$</span> git submodule update --init --recursive<br><br><span class="muted"># 查看父仓库记录的状态</span><br><span class="prompt">$</span> git submodule status</div><div class="grid grid-2"><div class="card"><h4>目录为空</h4><p>通常是忘记初始化子模块，运行 update 命令。</p></div><div class="card"><h4>子模块有改动</h4><p>先确认自己是否真的要修改依赖；子模块内部有独立历史与分支。</p></div></div><div class="callout"><b>更新子模块指针也需要提交父仓库。</b>否则同伴不会取得你验证过的依赖版本。</div></section>
