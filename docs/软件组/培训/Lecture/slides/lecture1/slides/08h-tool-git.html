<section>
  <div class="slide-head">
    <h2 class="slide-title">工具详解：Git</h2>
    <p class="lead">负责"<b>记</b>"：代码的历史、回滚与多人协作。</p>
  </div>

  <div class="grid grid-2">
    <div class="card">
      <h4><span class="card-index">01</span>它是什么</h4>
      <p>分布式版本管理工具：每台电脑上都有一份完整历史，不联网也能提交、回滚。</p>
    </div>
    <div class="card">
      <h4><span class="card-index">02</span>在工作流里干什么</h4>
      <p>每次改动都有快照可回滚；组内共用仓库，分支开发、合入主线，代码评审有依据。</p>
    </div>
    <div class="card">
      <h4><span class="card-index">03</span>关键操作</h4>
      <p><span class="mono">clone</span> 获取仓库；<span class="mono">add → commit → push</span> 为基本流程；<span class="mono">git --version</span> 验证安装；<span class="mono">.gitignore</span> 里忽略 build/。</p>
    </div>
    <div class="card">
      <h4><span class="card-index">04</span>常见坑</h4>
      <p>把编译产物提交进仓库；遇到冲突不敢动手——冲突只是两段改动摆在一起等你选。</p>
    </div>
  </div>

  <div class="callout">要点：<b>未提交的改动无法追溯、无法回滚</b>，应及时提交。</div>

  <p class="back-link"><a data-goto="9">← 返回工具链总览</a></p>
</section>
