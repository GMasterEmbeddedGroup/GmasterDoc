<section>
  <div class="slide-head">
    <h2 class="slide-title">动手练习：写出你的第一行输出</h2>
    <p class="lead">现在就打开 VS Code 动手做，卡住随时举手。<b>跑通了才算学会。</b></p>
  </div>

  <div class="checklist">
    <label class="check-item"><input type="checkbox"><span><b>练习 1</b>　把 <span class="mono">hello.c</span> 里的内容改成输出自己的名字与组别（一行），编译运行成功</span></label>
    <label class="check-item"><input type="checkbox"><span><b>练习 2</b>　用两条 <span class="mono">printf</span> 输出两行内容，观察 <span class="mono">\n</span> 的作用；再把第一条的 <span class="mono">\n</span> 删掉，看看输出有什么变化</span></label>
    <label class="check-item"><input type="checkbox"><span><b>练习 3</b>　故意删掉一个分号并编译，把报错信息读一遍，再补回来</span></label>
    <label class="check-item"><input type="checkbox"><span><b>练习 4</b>　在代码里写一行 <span class="mono">//</span> 注释，说明这个程序是干什么的</span></label>
  </div>

  <div class="cl-progress">
    <span>练习进度</span>
    <span class="cl-bar"><span class="cl-bar-fill"></span></span>
    <span class="cl-count">0 / 4</span>
  </div>

  <div class="callout tip">
    <b>遇到问题怎么提问：</b>把「代码 + 完整报错信息」一起发出来。
    只说「我的代码报错了」没人能帮你，编译器其实已经把线索给全了。
  </div>
</section>
