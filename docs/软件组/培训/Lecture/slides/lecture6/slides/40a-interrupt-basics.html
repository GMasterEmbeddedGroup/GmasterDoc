<section><div class="slide-head"><h2 class="slide-title">中断的基本概念</h2><p class="lead">CPU 暂停当前程序，处理硬件事件，再回到原位置继续执行。</p></div><img class="schematic" src="img/interrupt-timeline.png" alt="中断打断主任务并返回"><div class="photo-caption">主任务在断点暂停，中断服务结束后继续原任务</div><div class="why-line"><b>中断源</b><span>提出请求的硬件，例如 GPIO、定时器、串口或 SysTick。</span></div><div class="why-line"><b>IRQ</b><span>Interrupt Request，中断源送往处理器的请求。</span></div><div class="why-line"><b>ISR</b><span>Interrupt Service Routine，中断发生后 CPU 执行的服务函数。</span></div><div class="why-line"><b>现场与断点</b><span>CPU 自动保存必要寄存器和返回位置，ISR 结束后恢复执行。</span></div></section>
