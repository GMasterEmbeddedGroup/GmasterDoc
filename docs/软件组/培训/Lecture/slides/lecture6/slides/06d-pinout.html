<section><div class="slide-head"><h2 class="slide-title">封装图把逻辑名称映射到物理脚</h2><p class="lead">STM32F103C8T6 常见封装为 LQFP48。缺口或圆点标记 pin 1，编号沿封装边缘排列。</p></div><img class="schematic tall" src="img/f103-lqfp48-pinout.png" alt="STM32F103 LQFP48 引脚分布"><div class="photo-caption">STM32F103x8/xB 数据手册 Figure 8：LQFP48 pinout</div><div class="circuit-note">PC13 位于物理 pin 2，PA13 位于 pin 34。VDD/VSS 是数字电源与地，VDDA/VSSA 服务模拟部分。供电脚不是普通 GPIO。</div></section>
