<section><div class="slide-head"><h2 class="slide-title">GMaster 的 Fork + Pull Request 流程</h2><p class="lead">开发分支推到 origin，再向 upstream 的 main 发起 PR。</p></div><div class="flow"><div class="flow-box"><b>同步 main</b><span class="fx">pull upstream main</span></div><span class="flow-arrow">→</span><div class="flow-box"><b>建立分支</b><span class="fx">switch -c dev/...</span></div><span class="flow-arrow">→</span><div class="flow-box"><b>开发提交</b><span class="fx">add + commit</span></div><span class="flow-arrow">→</span><div class="flow-box"><b>推送 Fork</b><span class="fx">push -u origin</span></div><span class="flow-arrow">→</span><div class="flow-box is-hi"><b>创建 PR</b><span class="fx">base: upstream/main</span></div></div><div class="checklist"><label class="check-item"><input type="checkbox"><span>PR 标题说明结果，描述写清背景、改动和验证方法</span></label><label class="check-item"><input type="checkbox"><span>Files changed 中没有 build、密钥或无关格式化</span></label><label class="check-item"><input type="checkbox"><span>CI 通过，评审意见在原分支继续提交，PR 会自动更新</span></label></div><div class="cl-progress"><span class="cl-count"></span><div class="cl-bar"><div class="cl-bar-fill"></div></div></div></section>
