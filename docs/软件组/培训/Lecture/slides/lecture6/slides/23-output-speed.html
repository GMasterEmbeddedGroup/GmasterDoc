<section><div class="slide-head"><h2 class="slide-title">输出速度不是程序执行速度</h2><p class="lead">F103 的 MODE 位选择 2 MHz、10 MHz 或 50 MHz 输出驱动能力和边沿速度。</p></div><table class="mode-table"><tr><th>设置</th><th>适用</th><th>影响</th></tr><tr><td>LOW / 2 MHz</td><td>LED、继电器使能、低速片选</td><td>边沿较缓，EMI 与瞬态电流较小</td></tr><tr><td>MEDIUM / 10 MHz</td><td>中速数字信号</td><td>在速度与信号完整性之间折中</td></tr><tr><td>HIGH / 50 MHz</td><td>确实需要的高速 SPI/PWM</td><td>边沿更陡，更容易振铃和串扰</td></tr></table><div class="callout">输出速度设为 50 MHz 不会让 <span class="mono">HAL_GPIO_TogglePin()</span> 自动每秒执行 5000 万次。</div></section>
