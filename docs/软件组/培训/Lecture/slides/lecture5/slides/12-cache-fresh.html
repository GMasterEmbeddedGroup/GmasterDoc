<section><div class="slide-head"><h2 class="slide-title">CMake 缓存与重新配置</h2><p class="lead">配置结果写进构建目录。改源码通常不用重新配置，改工程描述通常需要。</p></div><table><thead><tr><th>改动</th><th>下一步</th></tr></thead><tbody><tr><td>只改 <span class="mono">.c/.cpp</span></td><td><span class="mono">cmake --build build</span></td></tr><tr><td>增加源文件、库或选项</td><td>重新运行配置命令，再构建</td></tr><tr><td>切换编译器或生成器</td><td>使用新构建目录，或 <span class="mono">cmake --fresh</span></td></tr><tr><td>缓存状态无法解释</td><td>删除明确的 build 目录后重新配置</td></tr></tbody></table><div class="terminal"><span class="prompt">$</span> cmake --fresh -S . -B build -G Ninja<br><span class="muted"># 重新生成缓存，不删除源码</span></div><div class="callout warn"><b>不要只删 CMakeCache.txt 后继续猜。</b>对可再生的构建目录整体重建通常更清楚。</div></section>
