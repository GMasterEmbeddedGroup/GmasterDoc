<section><div class="slide-head"><h2 class="slide-title">安全撤销：先确认要撤销哪一层</h2><p class="lead">新手优先使用含义明确、影响范围小的命令。</p></div><table class="dense"><thead><tr><th>需求</th><th>命令</th><th>结果</th></tr></thead><tbody><tr><td>取消暂存，保留文件修改</td><td><span class="mono">git restore --staged file</span></td><td>暂存区退回工作区</td></tr><tr><td>丢弃某文件未提交修改</td><td><span class="mono">git restore file</span></td><td>不可恢复，运行前看 diff</td></tr><tr><td>补漏文件或改最近提交信息</td><td><span class="mono">git commit --amend</span></td><td>重写最近提交</td></tr><tr><td>撤销已经共享的提交</td><td><span class="mono">git revert &lt;hash&gt;</span></td><td>新增一个反向提交，保留历史</td></tr></tbody></table><div class="callout danger"><b>不要把 reset --hard 当作通用“撤销”。</b>它可能同时移动分支并丢弃工作区与暂存区内容。</div></section>
