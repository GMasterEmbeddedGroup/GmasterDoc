<section><div class="slide-head"><h2 class="slide-title">CMake 随堂小测</h2><p class="lead">app 包含 calc.h 时失败，但 calc.c 自己可以编译。最可能缺少什么？</p></div><div class="quiz"><button class="quiz-opt" data-explain="重新配置可能触发检查，但不会凭空增加头文件搜索路径。">A. 再运行一次 cmake --build</button><button class="quiz-opt" data-correct="1" data-explain="公开头文件路径应通过 calc 的 PUBLIC 使用要求传播给 app。">B. 为 calc 设置 PUBLIC 的 target_include_directories</button><button class="quiz-opt" data-explain="把头文件当源文件列出不会建立正确的搜索路径。">C. 把 calc.h 加进 add_executable</button><button class="quiz-opt" data-explain="Release 与 Debug 不会决定头文件能否找到。">D. 改为 Release</button><div class="quiz-feedback"></div></div><div class="callout"><b>排错顺序：</b>确认错误阶段，找到第一个报错文件，再检查它所属目标的使用要求。</div></section>
