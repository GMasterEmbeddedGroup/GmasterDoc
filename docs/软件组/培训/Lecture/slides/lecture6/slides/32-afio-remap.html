<section><div class="slide-head"><h2 class="slide-title">AFIO 重映射与 JTAG 引脚</h2><p class="lead">STM32F1 使用 AFIO_MAPR 在可选引脚之间重映射外设功能，并控制调试口占用。</p></div><div class="explain"><p>PA13/PA14 默认用于 SWD，PA15/PB3/PB4 还可能被 JTAG 占用。把这些脚当普通 GPIO 前，需要在 CubeMX 的 SYS Debug 中选择合适调试模式。</p><p>保留 Serial Wire 可继续使用 SWDIO/SWCLK 下载和调试，同时释放部分 JTAG 引脚。</p></div><div class="error-box"><b>不要误关调试口：</b>新手若把 SWD 一并禁用，下一次可能无法正常下载。恢复通常需要 BOOT 配置、复位时连接或全片擦除。</div></section>
