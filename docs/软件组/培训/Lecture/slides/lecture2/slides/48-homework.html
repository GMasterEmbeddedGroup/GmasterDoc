  <div class="slide-head">

  <div class="checklist">
    <label class="check-item"><input type="checkbox"><span><b>① 环境</b>　执行 <span class="mono">gcc --version</span> 有版本号输出，并能编译运行 <span class="mono">hello.c</span></span></label>

    <label class="check-item"><input type="checkbox"><span><b>③ 数据类型</b>　打印各类型的 <span class="mono">sizeof</span>，整理成表格</span></label>

  </div>
