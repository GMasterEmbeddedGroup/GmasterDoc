<section><div class="slide-head"><h2 class="slide-title">中断向量表与 ISR</h2><p class="lead">向量表按固定顺序保存处理函数入口地址，CPU 用异常编号找到正确函数。</p></div><img class="schematic" src="img/interrupt-vector-table.png" alt="STM32F103 中断与异常向量表"><div class="photo-caption">STM32F103 中断和异常向量表示例，实际符号定义在启动文件中</div><div class="explain"><p><b>ISR</b> 是 Interrupt Service Routine，即中断服务函数。启动文件把 <span class="mono">EXTI0_IRQHandler</span> 等符号放进向量表，函数名不能随意修改。</p><p>EXTI0 至 EXTI4 各有一个 IRQHandler；EXTI5–9 共用 <span class="mono">EXTI9_5_IRQHandler</span>；EXTI10–15 共用 <span class="mono">EXTI15_10_IRQHandler</span>。</p></div></section>
