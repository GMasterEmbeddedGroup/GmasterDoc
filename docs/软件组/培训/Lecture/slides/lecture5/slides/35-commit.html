<section><div class="slide-head"><h2 class="slide-title">git commit：保存一个有意义的快照</h2><p class="lead">一次提交只解决一个主题，并用动词说明改了什么。</p></div><div class="terminal"><span class="prompt">$</span> git commit -m "add calc library target"<br>[dev/cmake-demo a1b2c3d] add calc library target<br> 4 files changed, 32 insertions(+)</div><div class="grid grid-2"><div class="card"><h4>好的提交</h4><p><span class="mono">fix CAN receive timeout</span><br><span class="mono">document Debug preset</span></p></div><div class="card"><h4>信息不足</h4><p><span class="mono">update</span><br><span class="mono">fix bug</span><br><span class="mono">final final</span></p></div></div><div class="callout"><b>提交是本地操作。</b>提交完成后再次运行 <span class="mono">git status</span>，确认是否还有遗漏。</div></section>
