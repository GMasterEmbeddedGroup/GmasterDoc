<section><div class="slide-head"><h2 class="slide-title">预处理练习：先展开，再判断</h2><p class="lead">先写出宏展开后的代码，再判断结果。</p></div><pre><code class="language-c">#define SQUARE(x) ((x) * (x))

int n = 3;
int result = SQUARE(n++);</code></pre><p>展开后是 <code>((n++) * (n++))</code>。同一个表达式中多次修改 <code>n</code> 属于未定义行为，不要依赖任何具体结果，应当直接改写。</p><div class="callout">宏的实参保持简单；带副作用的计算改用函数。</div></section>
